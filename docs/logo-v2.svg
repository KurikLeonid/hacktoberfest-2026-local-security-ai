<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <title>Local DLP Guard</title>
  <g stroke="#1f2937" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ===== Worker (left, pinned, leaning back) ===== -->
    <!-- body: shirt -->
    <path d="M120 300 q-10 60 10 140 h120 q10-70 -10-130 q-60-30 -120-10z" fill="#e5e7eb"/>
    <!-- tie -->
    <path d="M178 300 l-10 20 12 70 12-70 -10-20z" fill="#dc2626"/>
    <!-- lanyard + badge -->
    <path d="M150 300 q30 60 30 90 q0-30 34-90" fill="none" stroke="#2563eb" stroke-width="4"/>
    <rect x="160" y="385" width="44" height="54" rx="6" fill="#fff"/>
    <rect x="160" y="385" width="44" height="14" rx="4" fill="#2563eb"/>
    <circle cx="182" cy="414" r="8" fill="#9ca3af" stroke-width="3"/>
    <path d="M168 430 h28" stroke-width="3"/>
    <!-- flailing arm -->
    <path d="M128 320 q-50 10 -70 -20" fill="none" stroke-width="22" stroke="#1f2937"/>
    <path d="M128 320 q-50 10 -70 -20" fill="none" stroke-width="14" stroke="#e5e7eb"/>
    <path d="M52 300 l-14 -18 m14 18 l-20 -4 m20 4 l-8 -22 m8 22 l4 -20" fill="none" stroke-width="5"/>
    <circle cx="56" cy="298" r="11" fill="#f2c9a0"/>
    <!-- worker arm reaching for ENTER -->
    <path d="M232 330 q40 20 68 40" fill="none" stroke-width="22" stroke="#1f2937"/>
    <path d="M232 330 q40 20 68 40" fill="none" stroke-width="14" stroke="#e5e7eb"/>
    <circle cx="304" cy="372" r="11" fill="#f2c9a0"/>
    <path d="M310 378 l10 6" fill="none" stroke-width="6"/>
    <!-- neck -->
    <path d="M160 290 q20 10 44 0 v-30 h-44z" fill="#f2c9a0"/>
    <!-- head tilted back -->
    <g transform="rotate(-18 175 200)">
      <ellipse cx="175" cy="205" rx="62" ry="70" fill="#f2c9a0"/>
      <!-- spiky hair -->
      <g transform="translate(0 274) scale(1 -1)">
      <!-- hat: orange blocky critter -->
      <g fill="#d97757">
        <rect x="112" y="100" width="126" height="62" rx="4"/>
        <rect x="98" y="122" width="16" height="22"/>
        <rect x="236" y="122" width="16" height="22"/>
        <rect x="122" y="160" width="12" height="14"/>
        <rect x="146" y="160" width="12" height="14"/>
        <rect x="192" y="160" width="12" height="14"/>
        <rect x="216" y="160" width="12" height="14"/>
      </g>
      <rect x="146" y="118" width="12" height="16" fill="#1f2937" stroke="none"/>
      <rect x="192" y="118" width="12" height="16" fill="#1f2937" stroke="none"/>
      </g>
      <!-- bulging eyes -->
      <circle cx="150" cy="190" r="22" fill="#fff"/>
      <circle cx="198" cy="186" r="22" fill="#fff"/>
      <circle cx="146" cy="194" r="5" fill="#1f2937" stroke="none"/>
      <circle cx="204" cy="180" r="5" fill="#1f2937" stroke="none"/>
      <!-- screaming mouth + tongue -->
      <path d="M150 232 q28 -14 56 0 q4 40 -28 48 q-30 -6 -28 -48z" fill="#3f0d0d"/>
      <path d="M180 260 q10 20 -4 44 q14 -10 16 -30" fill="#ef4444" stroke-width="3"/>
    </g>

    <!-- ===== Guard (right, leaning in) ===== -->
    <!-- body: uniform -->
    <path d="M380 250 q90 -30 170 30 q30 80 10 180 h-210 q-20 -110 30 -210z" fill="#1e3a8a"/>
    <!-- belt -->
    <path d="M352 420 h206" stroke="#111827" stroke-width="16"/>
    <!-- shoulder patch -->
    <path d="M500 280 l22 4 -4 26 -20 -6z" fill="#facc15" stroke-width="3"/>
    <!-- arms lowered, grabbing the worker's wrist above ENTER -->
    <path d="M420 330 q-60 30 -112 34" fill="none" stroke-width="40" stroke="#1f2937"/>
    <path d="M420 330 q-60 30 -112 34" fill="none" stroke-width="30" stroke="#1e3a8a"/>
    <path d="M450 380 q-70 10 -132 0" fill="none" stroke-width="40" stroke="#1f2937"/>
    <path d="M450 380 q-70 10 -132 0" fill="none" stroke-width="30" stroke="#1e3a8a"/>
    <path d="M312 348 q-30 -2 -34 18 q8 16 34 12z" fill="#c98b5e"/>
    <path d="M318 370 q-30 2 -30 20 q10 12 34 6z" fill="#c98b5e"/>
    <path d="M286 356 h-8 m10 10 h-10 m12 14 h-8 m10 10 h-10" fill="none" stroke-width="3"/>
    <!-- head -->
    <ellipse cx="450" cy="175" rx="66" ry="74" fill="#c98b5e"/>
    <!-- cap -->
    <path d="M384 150 q10 -70 70 -72 q60 2 66 64z" fill="#1e3a8a"/>
    <path d="M384 150 q-40 4 -54 18 q40 4 80 -6z" fill="#111827"/>
    <rect x="428" y="104" width="44" height="22" rx="4" fill="#facc15" stroke-width="3"/>
    <text x="450" y="121" text-anchor="middle" font-family="Arial Black,Arial" font-size="12" font-weight="900" fill="#1e3a8a" stroke="none">SEC</text>
    <!-- angry brows + eye -->
    <path d="M400 168 l40 14 m-44 -2 l30 -2" fill="none" stroke-width="7"/>
    <circle cx="420" cy="186" r="14" fill="#fff"/>
    <circle cx="414" cy="188" r="5" fill="#1f2937" stroke="none"/>
    <!-- stubble jaw + clenched teeth -->
    <path d="M396 212 q40 40 104 10 q-10 40 -50 44 q-40 -6 -54 -54z" fill="#8b6a52"/>
    <path d="M404 222 q30 18 70 4 v16 q-36 14 -70 -6z" fill="#fff"/>
    <path d="M420 226 v14 m14 -12 v14 m14 -14 v14 m14 -16 v14" fill="none" stroke-width="3"/>
    <!-- ear -->
    <ellipse cx="510" cy="186" rx="10" ry="16" fill="#c98b5e"/>
  </g>
  <!-- motion lines -->
  <g stroke="#ef4444" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M90 140 q-14 -8 -24 4"/><path d="M84 112 q-18 -10 -30 6"/>
    <path d="M270 120 q14 -8 24 4"/><path d="M276 92 q18 -10 30 6"/>
  </g>
  <!-- ENTER key, in front of everyone, right under the worker's finger -->
  <g stroke="#1f2937" stroke-width="5" stroke-linejoin="round">
    <path d="M226 476 h132 v-30 h-40 v-40 h-92 z" fill="#374151"/>
    <path d="M232 466 h120 v-22 h-40 v-32 h-80 z" fill="#f9fafb"/>
    <text x="276" y="458" text-anchor="middle" font-family="Arial Black,Arial" font-size="20" font-weight="900" fill="#dc2626" stroke="none">ENTER</text>
    <text x="334" y="460" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#dc2626" stroke="none">⏎</text>
  </g>
</svg>
